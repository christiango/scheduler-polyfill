name: Stage package for npm

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use npm with staged publishing support
        run: npm install --global npm@11.20.0
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node <<'NODE'
          const {version} = require('./package.json');
          const tag = process.env.RELEASE_TAG;
          if (tag !== version && tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} must match package.json version ${version}`);
          }
          if (version.includes('-') && process.env.IS_PRERELEASE !== 'true') {
            throw new Error('Prerelease versions must be marked as a GitHub prerelease');
          }
          NODE
      - name: Install development dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run

  stage:
    name: Stage package (npm approval required)
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-stage-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with staged publishing support
        run: npm install --global npm@11.20.0
      - name: Stage package using trusted publishing
        run: npm stage publish --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
